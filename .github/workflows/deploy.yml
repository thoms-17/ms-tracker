name: Déploiement

on:
  push:
    branches: [prod]
  workflow_dispatch: # ajoute un bouton « Run workflow » dans l'onglet Actions

concurrency: deploy # jamais deux déploiements en même temps

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      SERVER: ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}
    steps:
      - uses: actions/checkout@v5

      # 1. On ne déploie que si les tests passent
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - run: pip install -r requirements-prod.txt pytest
      - run: python -m pytest -q

      # 2. Build du front
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - run: npm ci && npm run build
        working-directory: frontend

      # 3. Installe la clé SSH sur la machine de GitHub
      - name: Configurer SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          echo "${{ secrets.SSH_KNOWN_HOSTS }}" > ~/.ssh/known_hosts

      # 4. Met à jour le code et les dépendances sur AlwaysData
      - name: Mettre à jour le code
        run: |
          ssh $SERVER 'cd ~/ms-tracker && git pull --ff-only origin prod && .venv/bin/pip install -q -r requirements-prod.txt'

      # 5. Envoie le front buildé
      - name: Envoyer le front
        run:
          rsync -az --delete frontend/dist/ $SERVER:ms-tracker/frontend/dist/

      # 6. Redémarre le site via l'API d'AlwaysData (comme le bouton de l'admin)
      - name: Redémarrer le site
        run: |
          curl -sf -X POST --basic --user "${{ secrets.ALWAYSDATA_API_TOKEN }}:" \
            "https://api.alwaysdata.com/v1/site/${{ secrets.ALWAYSDATA_SITE_ID }}/restart/"

      # 7. Vérifie que la prod tourne sur CE commit
      - name: Vérifier la version en ligne
        run: |
          for i in 1 2 3 4 5 6; do
            sleep 5
            sha=$(curl -s -m 20 https://ms-tracker.alwaysdata.net/api/version | jq -r .git_sha 2>/dev/null || true)
            echo "En ligne : $sha — attendu : $GITHUB_SHA"
            if [ -n "$sha" ] && [ "${GITHUB_SHA#$sha}" != "$GITHUB_SHA" ]; then exit 0; fi
          done
          exit 1
